name: Terraform Plan & Apply

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
  push:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.0"
  AWS_REGION: "us-east-1"

jobs:
  detect-environment:
    name: Detect Changed Environment
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed environments
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1)
          fi

          ENVS="[]"

          if echo "$CHANGED_FILES" | grep -q "terraform/modules/\|terraform/envs/qa/"; then
            ENVS=$(echo "$ENVS" | jq '. + ["qa"]')
          fi
          if echo "$CHANGED_FILES" | grep -q "terraform/modules/\|terraform/envs/stage/"; then
            ENVS=$(echo "$ENVS" | jq '. + ["stage"]')
          fi
          if echo "$CHANGED_FILES" | grep -q "terraform/modules/\|terraform/envs/prod/"; then
            ENVS=$(echo "$ENVS" | jq '. + ["prod"]')
          fi

          # Deduplicate
          ENVS=$(echo "$ENVS" | jq -c 'unique')
          echo "environments=$ENVS" >> "$GITHUB_OUTPUT"
          echo "Detected environments: $ENVS"

  fmt-check:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

  security-scan:
    name: Security Scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: false

  plan:
    name: "Plan: ${{ matrix.environment }}"
    needs: [detect-environment, fmt-check, security-scan]
    if: needs.detect-environment.outputs.environments != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ fromJson(needs.detect-environment.outputs.environments) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/envs/${{ matrix.environment }}
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        working-directory: terraform/envs/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform/envs/${{ matrix.environment }}
        run: |
          terraform plan -no-color -out=${{ matrix.environment }}.tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              `terraform/envs/${{ matrix.environment }}/plan_output.txt`, 'utf8'
            );
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan: \`${{ matrix.environment }}\`

            \`\`\`
            ${truncated}
            \`\`\`

            *Plan result: ${{ steps.plan.outcome }}*`
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: terraform/envs/${{ matrix.environment }}/${{ matrix.environment }}.tfplan
          retention-days: 5

  apply-qa:
    name: "Apply: qa"
    needs: [detect-environment, plan]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(fromJson(needs.detect-environment.outputs.environments), 'qa')
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_qa }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/envs/qa
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-qa
          path: terraform/envs/qa

      - name: Terraform Apply (saved plan)
        working-directory: terraform/envs/qa
        run: terraform apply qa.tfplan

  apply-stage:
    name: "Apply: stage"
    needs: [detect-environment, plan, apply-qa]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(fromJson(needs.detect-environment.outputs.environments), 'stage') &&
      (needs.apply-qa.result == 'success' || needs.apply-qa.result == 'skipped')
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_stage }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/envs/stage
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-stage
          path: terraform/envs/stage

      - name: Terraform Apply (saved plan)
        working-directory: terraform/envs/stage
        run: terraform apply stage.tfplan

  apply-prod:
    name: "Apply: prod"
    needs: [detect-environment, plan, apply-stage]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(fromJson(needs.detect-environment.outputs.environments), 'prod') &&
      (needs.apply-stage.result == 'success' || needs.apply-stage.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_prod }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/envs/prod
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: terraform/envs/prod

      - name: Terraform Apply (saved plan)
        working-directory: terraform/envs/prod
        run: terraform apply prod.tfplan
